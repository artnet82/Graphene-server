<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>GRAPHENE ANTIVIRYS ADMIN  · Вход</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/graphene.css') }}">
</head>
<body>
<div class="login-wrap">
  <form method="post" class="login-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="login-shield"></div>
    <h1>GRAPHENE ANTIVIRYS ADMIN </h1>
    <p class="muted small">Administrative console</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <label for="username">Логин</label>
    <input id="username" name="username" type="text" required autofocus autocomplete="username">

    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">

    <button type="submit">Войти</button>

    <p class="muted small center">FOR GRAPHENE OS</p>
  </form>
</div>
</body>
</html>
