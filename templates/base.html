<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Графен{% endblock %} · Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/graphene.css') }}">
</head>
<body>
{% if current_user.is_authenticated %}
<nav class="nav">
  <a class="brand" href="{{ url_for('dashboard') }}">
    <span class="brand-shield"></span>
    <span>ГРАФЕН</span>
    <small>ADMIN</small>
  </a>
  <div class="nav-links">
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Обзор</a>
    <a href="{{ url_for('devices') }}" class="{{ 'active' if request.endpoint in ['devices','device_detail'] }}">Устройства</a>
    <a href="{{ url_for('threats_list') }}" class="{{ 'active' if request.endpoint == 'threats_list' }}">Угрозы</a>
    <a href="{{ url_for('network') }}" class="{{ 'active' if request.endpoint == 'network' }}">Сеть</a>
    <a class="logout" href="{{ url_for('logout') }}">Выход</a>
  </div>
</nav>
{% endif %}

<main class="{% block main_class %}container{% endblock %}">
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
